name: Deploy Jarvis PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Jarvis static frontend
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R src/web/static/. _site/

          test -f _site/index.html
          test -f _site/finance.html
          test -f _site/organization.html
          test -f _site/manifest.webmanifest
          test -f _site/service-worker.js
          test -f _site/jarvis-theme.css
          test -f _site/jarvis-local-store.js
          test -f _site/jarvis-shared.js
          test -f _site/icons/icon-192.png
          test -f _site/icons/icon-512.png
          test -f _site/icons/apple-touch-icon.png
          test -f _site/icons/icon.svg
          test -f _site/icons/maskable.svg
          test -f _site/.nojekyll

          echo "Jarvis Pages artifact contents:"
          find _site -maxdepth 3 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
